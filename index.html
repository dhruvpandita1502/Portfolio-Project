<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PORTFOLIO</title>

    <link rel="stylesheet" href="style.css">

    <!-- Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
          rel="stylesheet">

    <!-- Archivo Black -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
          rel="stylesheet">

    <!-- Fuzzy Bubbles -->
    <link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- Cursive -->
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap"
          rel="stylesheet">
</head>


<body>

    <!-- =========================================
         SCROLL AREA
    ========================================== -->

    <div class="hero-scroll">

        <!-- =====================================
             FIRST SCREEN
        ====================================== -->

        <section class="background">

            <!-- HEADING -->

            <div class="heading">

                <h1 class="headingwhite">
                    PORTFOLIO
                </h1>

                <h2 class="headingblack">
                    portfolio
                </h2>

            </div>


            <!-- FOOD / STICKER IMAGES -->

            <div class="stickers">

                <img id="emoji1"
                     src="images/fries.png"
                     alt="fries">

                <img id="emoji2"
                     src="images/avocado.png"
                     alt="avocado">

                <img id="emoji3"
                     src="images/burger.png"
                     alt="burger">

                <img id="emoji4"
                     src="images/pizza.png"
                     alt="pizza">

                <img id="emoji5"
                     src="images/noodles.png"
                     alt="noodles">

                <img id="emoji6"
                     src="images/teddy.png"
                     alt="teddy">

            </div>

        </section>

    </div>


    <!-- =========================================
         NEXT SECTION
    ========================================== -->

    <section id="content1">

        <h1>ABOUT ME</h1>

    </section>


</body>

</html>
